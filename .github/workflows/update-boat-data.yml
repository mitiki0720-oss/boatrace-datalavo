name: Update boat race data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode
        required: false
        default: initial
        type: choice
        options:
          - initial
          - active
          - results
          - final
      targetSession:
        description: Target session
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - day
          - night

concurrency:
  group: boat-data-update-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  update-boat-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main before generating data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update BOATRACE generated data
        run: node scripts/updateBoatData.mjs --mode "${{ inputs.mode }}" --target-session "${{ inputs.targetSession }}"

      - name: Notify boat results
        env:
          BOAT_SLACK_WEBHOOK_URL: ${{ secrets.BOAT_SLACK_WEBHOOK_URL }}
        run: node scripts/notifyBoatSlackHits.mjs --send --write

      - name: Check generated files
        run: |
          echo "=== today.generated.json ==="
          head -n 20 public/data/boatrace/today.generated.json

          echo "=== today-race-details.generated.json ==="
          head -n 20 public/data/boatrace/today-race-details.generated.json

          echo "=== venue-extras.generated.json ==="
          head -n 20 public/data/boatrace/venue-extras.generated.json

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== restore non-generated lockfile changes ==="
          git restore package-lock.json || true

          git add public/data

          echo "=== git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update boat race generated data"

            echo "=== git status after commit ==="
            git status --short

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Uncommitted changes remain after generated data commit"
              git status --short
              exit 1
            fi

            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi

              if [ "$i" -eq 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi

              sleep 5
            done
          fi