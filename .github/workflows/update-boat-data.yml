name: Update boat race data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-boat-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update BOATRACE today race details
        run: node scripts/updateBoatTodayRaceDetails.mjs

      - name: Update BOATRACE venue extras
        run: node scripts/updateBoatVenueExtras.mjs

      - name: Check generated files
        run: |
          echo "=== today.generated.json ==="
          head -n 20 public/data/boatrace/today.generated.json

          echo "=== today-race-details.generated.json ==="
          head -n 20 public/data/boatrace/today-race-details.generated.json

          echo "=== venue-extras.generated.json ==="
          head -n 20 public/data/boatrace/venue-extras.generated.json

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== restore non-generated lockfile changes ==="
          git restore package-lock.json || true

          git add public/data

          echo "=== git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update boat race generated data"

            echo "=== git status after commit ==="
            git status --short

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Uncommitted changes remain after generated data commit"
              git status --short
              exit 1
            fi

            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi

              if [ "$i" -eq 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi

              sleep 5
            done
          fi