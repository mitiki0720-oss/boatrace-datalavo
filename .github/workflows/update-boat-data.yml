name: Update boat race data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode
        required: false
        default: initial
        type: choice
        options:
          - initial
          - active
          - results
          - final
      targetSession:
        description: Target session
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - day
          - night
      run_boatrace_ex:
        description: Run BOATRACE EX daily pipeline
        required: false
        default: false
        type: boolean
      boatrace_ex_date:
        description: BOATRACE EX target date: auto, latest, or YYYY-MM-DD
        required: false
        default: auto
        type: string
      boatrace_ex_refresh_history:
        description: Refresh BOATRACE EX history even when it already exists
        required: false
        default: false
        type: boolean
  schedule:
    # 00:05 JST and 06:05 JST. GitHub Actions schedules are UTC.
    # 06:05 JST refreshes all official pre-race material once after morning publication.
    - cron: "5 15 * * *"
    - cron: "5 21 * * *"

concurrency:
  group: boat-data-update-main
  cancel-in-progress: false
  queue: single

permissions:
  contents: write

jobs:
  update-boat-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main before generating data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update BOATRACE generated data
        run: node scripts/updateBoatData.mjs --mode "${{ inputs.mode || 'initial' }}" --target-session "${{ inputs.targetSession || 'auto' }}"

      - name: Notify boat results
        env:
          BOATRACE_SLACK_WEBHOOK_URL: ${{ secrets.BOATRACE_SLACK_WEBHOOK_URL }}
        run: node scripts/notifyBoatSlackHits.mjs --send --write

      - name: Check generated files
        run: |
          echo "=== today.generated.json ==="
          head -n 20 public/data/boatrace/today.generated.json

          echo "=== today-race-details.generated.json ==="
          head -n 20 public/data/boatrace/today-race-details.generated.json

          echo "=== venue-extras.generated.json ==="
          head -n 20 public/data/boatrace/venue-extras.generated.json

      - name: Run BOATRACE EX daily pipeline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_boatrace_ex == true }}
        shell: bash
        run: |
          set -euo pipefail

          EX_DATE="${{ inputs.boatrace_ex_date }}"
          REFRESH_HISTORY="${{ inputs.boatrace_ex_refresh_history }}"

          ARGS=(--date "$EX_DATE")
          if [ "$REFRESH_HISTORY" = "true" ]; then
            ARGS+=(--refresh-history)
          fi

          GENERATE_SUMMARY="$(mktemp)"
          CHECK_SUMMARY="$(mktemp)"

          node scripts/generateBoatExDaily.mjs "${ARGS[@]}" | tee "$GENERATE_SUMMARY"
          node scripts/checkBoatExDaily.mjs --date "$EX_DATE" | tee "$CHECK_SUMMARY"
          node scripts/checkBoatExDateIndex.mjs

          node - "$GITHUB_STEP_SUMMARY" "$GENERATE_SUMMARY" "$CHECK_SUMMARY" "$EX_DATE" "$REFRESH_HISTORY" <<'NODE'
          const fs = require("node:fs");
          const [summaryPath, generatePath, checkPath, requestedDate, refreshHistory] = process.argv.slice(2);

          function readSummary(filePath) {
            try {
              const text = fs.readFileSync(filePath, "utf8");
              const start = text.indexOf("{");
              const end = text.lastIndexOf("}");
              if (start < 0 || end < start) return {};
              return JSON.parse(text.slice(start, end + 1));
            } catch {
              return {};
            }
          }

          const generated = readSummary(generatePath);
          const checked = readSummary(checkPath);
          const lines = [
            "## BOATRACE EX daily pipeline",
            `- requested date: ${requestedDate}`,
            `- resolved date: ${checked.date ?? generated.date ?? "unknown"}`,
            `- refresh history: ${refreshHistory}`,
            `- status: completed`,
          ];

          if (checked.latestDate ?? generated.dateIndex?.latestDate) lines.push(`- latestDate: ${checked.latestDate ?? generated.dateIndex.latestDate}`);
          if (checked.dateCount ?? generated.dateIndex?.dateCount) lines.push(`- dateCount: ${checked.dateCount ?? generated.dateIndex.dateCount}`);
          if (checked.records ?? generated.history?.records) lines.push(`- records: ${checked.records ?? generated.history.records}`);
          if (checked.venues ?? generated.history?.venues) lines.push(`- venues: ${checked.venues ?? generated.history.venues}`);
          if (checked.racerCount ?? generated.racerEvidence?.racerCount) lines.push(`- racerCount: ${checked.racerCount ?? generated.racerEvidence.racerCount}`);
          if (checked.appearanceCount ?? generated.racerEvidence?.appearanceCount) lines.push(`- appearanceCount: ${checked.appearanceCount ?? generated.racerEvidence.appearanceCount}`);

          fs.appendFileSync(summaryPath, `${lines.join("\n")}\n`);
          NODE

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== restore non-generated lockfile changes ==="
          git restore package-lock.json || true

          git add public/data

          echo "=== git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update boat race generated data"

            echo "=== git status after commit ==="
            git status --short

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Uncommitted changes remain after generated data commit"
              git status --short
              exit 1
            fi

            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi

              if [ "$i" -eq 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi

              sleep 5
            done
          fi
