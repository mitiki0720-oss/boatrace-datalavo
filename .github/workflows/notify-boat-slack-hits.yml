name: notify-boat-slack-hits

on:
  workflow_dispatch:
    inputs:
      mode:
        description: notify mode
        required: false
        default: send
        type: choice
        options:
          - dry-run
          - send
  push:
    branches:
      - main
    paths:
      - public/data/boatrace/johnson-predictions.generated.json
      - public/data/boatrace/today-race-details.generated.json
      - scripts/notifyBoatSlackHits.mjs

jobs:
  notify:
    concurrency:
      group: boatrace-slack-hit-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Sync latest main before notification
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notify boat results
        env:
          BOATRACE_SLACK_WEBHOOK_URL: ${{ secrets.BOATRACE_SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode || 'send' }}" = "dry-run" ]; then
            npm run notify:boat-slack-hits -- --dry-run
          else
            npm run notify:boat-slack-hits -- --send --write
          fi

      - name: Commit notified keys
        run: |
          if git diff --quiet -- public/data/boatrace/slack-hit-notified-keys.generated.json; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- public/data/boatrace/slack-hit-notified-keys.generated.json
          git commit -m "Update boat slack notified keys"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$i" -eq 3 ]; then
              echo "::error::Failed to push notified keys after 3 attempts"
              exit 1
            fi

            git pull --rebase origin main
          done
