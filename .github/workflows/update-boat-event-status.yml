name: Update boat venue event status

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in JST YYYY-MM-DD. Empty = JST today"
        required: false
        default: ""
        type: string
  schedule:
    # Every 15 minutes from 06:00 through 21:45 JST. GitHub Actions schedules are UTC.
    - cron: "*/15 21-23 * * *"
    - cron: "*/15 0-12 * * *"

concurrency:
  group: update-boat-event-status-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-event-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh official venue event statuses
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${TARGET_DATE//[[:space:]]/}" ]; then
            ARGS+=(--target-date "$TARGET_DATE")
          fi
          node scripts/updateBoatVenueEventStatuses.mjs "${ARGS[@]}"
          node scripts/checkBoatVenueEventStatusLive.mjs "${ARGS[@]}" --feed-dir public/data/boatrace

      - name: Commit event status changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- \
            public/data/boatrace/today.generated.json \
            public/data/boatrace/today-race-details.generated.json

          if git diff --cached --name-only | grep -Eq '^(public/data/reviews/|public/data/boatrace/johnson-predictions\.generated\.json$|public/data/boatrace/reviews/index\.json$|public/dog/)'; then
            echo "::error::Protected files were staged by the event status refresh"
            git diff --cached --name-only
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No venue event status changes."
            exit 0
          fi

          git diff --check --cached
          git commit -m "Update boat venue event statuses"
          git pull --rebase origin main
          git push origin HEAD:main
